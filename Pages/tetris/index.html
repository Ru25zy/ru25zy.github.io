<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <link rel="icon" href="../../../favicon.ico">
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div class="header">
    <a id="button-home" class="button-confirm" href="../../index.html">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
                <path fill="currentColor"
                      d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                <path fill="currentColor" d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
            </svg>
        </div>
        <div class="text">返回主页</div>
    </a>
</div>
<div class="container">
    <div id="gamer">
        <div class="title-container">
            <div class="title">俄罗斯方块</div>
            <div class="tips">Enter: 游戏开始 / 暂停 | ESC: 重置游戏 | Space: 硬掉落</div>
        </div>
        <div class="game-screen">
            <div id="grid-container"></div>
            <div id="score-container">
                <div class="score-card">
                    <div class="score-title">分数：</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-card">
                    <div class="score-title">等级：</div>
                    <div class="score-value" id="level">0</div>
                </div>
                <div class="score-card">
                    <div class="score-title">行数：</div>
                    <div class="score-value" id="lines">0</div>
                </div>
                <div class="score-card">
                    <div class="score-title">下一个：</div>
                    <div class="score-value" id="next"></div>
                </div>
                <div class="empty-div"></div>
                <div class="score-card">
                    <div class="score-value" id="timer">00:00:00</div>
                </div>
            </div>
        </div>
        <div id="controller-container">
            <div class="left">
                <div class="up">
                    <div class="button-log controller" id="btn-start">开始</div>
                    <div class="button-log controller" id="btn-pause">暂停</div>
                </div>
                <div class="button-log" id="btn-drop">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 16 16">
                        <path fill="currentColor" fill-rule="evenodd"  stroke="currentColor" stroke-width="2"
                              d="M3.646 4.146a.5.5 0 0 1 .708 0L8 7.793l3.646-3.647a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 0-.708M1 11.5a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 0 1h-13a.5.5 0 0 1-.5-.5"/>
                    </svg>
                </div>
            </div>
            <div class="right">
                <div class="button-log" id="btn-up">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
                        <path fill="currentColor" fill-rule="evenodd"  stroke="currentColor" stroke-width="2"
                              d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708z"/>
                    </svg>
                </div>
                <div class="down">
                    <div class="button-log" id="btn-left">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
                            <path fill="currentColor" fill-rule="evenodd"  stroke="currentColor" stroke-width="2"
                                  d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
                        </svg>
                    </div>
                    <div class="button-log" id="btn-down">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
                            <path fill="currentColor" fill-rule="evenodd"  stroke="currentColor" stroke-width="2"
                                  d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>
                        </svg>
                    </div>
                    <div class="button-log" id="btn-right">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="bi bi-chevron-right" viewBox="0 0 16 16">
                            <path fill="currentColor" fill-rule="evenodd"  stroke="currentColor" stroke-width="2"
                                  d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="popup-container hidden">
    <div class="popup">
        <div class="popup-title">游戏结束</div>
        <div class="popup-content">
            <div class="popup-item">
                <div class="popup-item-title">分数：</div>
                <div class="popup-item-value" id="popup-score">0</div>
            </div>
            <div class="popup-item">
                <div class="popup-item-title">用时：</div>
                <div class="popup-item-value" id="popup-timer">00:00:00</div>
            </div>
        </div>
        <div class="popup-button">重新开始</div>
    </div>
</div>
<script src="./assets/script.js"></script>
</body>
</html>
